<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSE Data Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:18px;
  background:
    radial-gradient(900px 600px at 15% -10%, rgba(134,239,172,.16), transparent 60%),
    radial-gradient(800px 600px at 110% 10%, rgba(34,197,94,.14), transparent 55%),
    #04100A;
  -webkit-user-select:none;user-select:none;
}
.card{
  width:460px;max-width:100%;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#0E2A1D,#0A2016);
  border:1px solid #1C4A34;box-shadow:0 30px 70px rgba(0,0,0,.6);
  animation:pop .35s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
.bar{height:5px;background:linear-gradient(90deg,#86EFAC,#22C55E,#059669,#86EFAC);background-size:200% 100%;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.body{padding:26px 24px 18px;text-align:center}
.icon{
  width:74px;height:74px;margin:0 auto 18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:32px;
  background:radial-gradient(circle at 50% 30%,rgba(134,239,172,.28),rgba(34,197,94,.06));
  border:1.5px solid rgba(134,239,172,.6);animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 7px rgba(34,197,94,.07)}50%{box-shadow:0 0 0 14px rgba(34,197,94,.14)}}
.ar{direction:rtl;font-size:19px;font-weight:900;color:#E9F6EF;line-height:1.8}
.ar small{display:block;font-size:14px;font-weight:600;color:#A9C9B7;margin-top:8px;line-height:1.9}
.sep{height:1px;background:linear-gradient(90deg,transparent,#1C4A34,transparent);margin:18px 0}
.en{direction:ltr;font-size:16px;font-weight:800;color:#E9F6EF;line-height:1.6}
.en small{display:block;font-size:13px;font-weight:600;color:#A9C9B7;margin-top:7px;line-height:1.7}
.actions{padding:4px 24px 24px}
.mailrow{display:none}
.btn{
  display:block;width:100%;padding:14px;border-radius:14px;border:1px solid rgba(134,239,172,.6);
  font-size:14.5px;font-weight:900;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;
  text-align:center;text-decoration:none;
  color:#fff;background:linear-gradient(135deg,#22C55E,#059669);
  box-shadow:0 10px 30px rgba(34,197,94,.40), 0 0 28px 6px rgba(134,239,172,.30), inset 0 0 0 1px rgba(255,255,255,.12);
  transition:transform .12s ease,filter .2s ease;
}
.btn::after{
  content:"";position:absolute;top:-60%;left:-40%;width:45%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);
  transform:rotate(18deg);animation:shine 2.8s linear infinite;pointer-events:none;
}
@keyframes shine{0%{transform:translateX(-40%) rotate(18deg)}100%{transform:translateX(320%) rotate(18deg)}}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.fallback{margin-top:12px;display:none;gap:8px}
.fallback.show{display:flex}
.fb{
  flex:1;padding:10px 8px;border-radius:12px;border:1px solid #1C4A34;background:#0C2A1D;
  color:#E9F6EF;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;
  text-align:center;text-decoration:none;transition:border-color .2s ease;
}
.fb:hover{border-color:rgba(134,239,172,.6)}
@media (max-width:480px){.ar{font-size:17px}.en{font-size:14.5px}}
</style>
</head>
<body>

<div class="card" role="alertdialog" aria-modal="true">
  <div class="bar"></div>
  <div class="body">
    <div class="icon">&#128279;</div>
    <div class="ar">
      تم الانتقال إلى رابط جديد
      <small>هذا البورتال لم يعد مُفعّلاً.<br>للحصول على الرابط الجديد يُرجى التواصل معنا.</small>
    </div>
    <div class="sep"></div>
    <div class="en">
      This portal has moved to a new link
      <small>This version is no longer active.<br>Please contact us to receive the new link.</small>
    </div>
  </div>
  <div class="actions">
    <a class="btn" id="contact" href="mailto:ibrahim.almalki@sbg.com.sa">&#9993;&#65039; تواصل معنا &nbsp;&bull;&nbsp; Contact Us</a>
    <div class="fallback" id="fallback">
      <a class="fb" id="owa" href="#" target="_blank" rel="noopener">فتح Outlook Web</a>
      <button class="fb" id="copyBtn" type="button">نسخ الإيميل</button>
    </div>
  </div>
</div>

<script>
(function(){
  var TO="ibrahim.almalki@sbg.com.sa";
  var MAILTO="mailto:"+TO;
  var OWA="https://outlook.office.com/mail/deeplink/compose?to="+TO;

  var btn=document.getElementById("contact"),
      fb=document.getElementById("fallback"),
      copyBtn=document.getElementById("copyBtn");

  btn.setAttribute("href",MAILTO);
  document.getElementById("owa").setAttribute("href",OWA);

  btn.addEventListener("click",function(){
    setTimeout(function(){ fb.classList.add("show"); },1200);
  });

  copyBtn.addEventListener("click",function(){
    var done=function(){ copyBtn.textContent="تم النسخ ✓"; setTimeout(function(){ copyBtn.textContent="نسخ الإيميل"; },2000); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(TO).then(done,done);
    } else {
      var t=document.createElement("textarea");
      t.value=TO; document.body.appendChild(t); t.select();
      try{ document.execCommand("copy"); }catch(e){}
      document.body.removeChild(t); done();
    }
  });
  document.addEventListener("contextmenu",function(e){e.preventDefault();});
})();
</script>

</body>
</html>
